name: Deploy to Amazon ECR

on:
  push:
    branches:
      - main  # Se ejecutará automáticamente cada vez que subas cambios a la rama main

# Permisos requeridos para autenticarse con AWS usando OIDC (sin contraseñas)
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Build and Push Image
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: arn:aws:iam::610140802215:role/github-sunsaver-ecr-role
        aws-region: eu-south-2
        audience: sts.amazonaws.com

    - name: Log in to Amazon ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2

    - name: Build, Tag, and Push Image to Amazon ECR
      env:
        ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        ECR_REPOSITORY: sunsaver-etl
        IMAGE_TAG: latest
      run: |
        # Compila la imagen Docker localmente en el servidor de GitHub
        docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
        
        # Sube la imagen directamente a tu ECR en la región de España
        docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG